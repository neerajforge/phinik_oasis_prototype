<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phinik Oasis — Operations Suite</title>
<!--
  PHINIK OASIS · OPERATIONS SUITE (Prototype)
  ------------------------------------------------------------
  Scope: EMS (staff), PMS (procurement), Kitchen Intelligence
  (recipe costing + waste) and CRM (private feedback + WhatsApp).
  Billing / POS is intentionally NOT handled — Petpooja owns it.

  Architecture (single file, framework-free build):
   • Tailwind CSS 2 (CDN)    → styling
   • Alpine.js 3 (CDN)        → reactive state & views
   • Storage adapter          → window.storage (artifact env) with
                                in-memory fallback. Swap `Store`
                                for localStorage or a Laravel API
                                when self-hosting.
  Sections of the script below:
   1. Utilities & constants
   2. Seed / mock data generator
   3. Alpine component: app()
      3a. Session & RBAC     3b. EMS     3c. PMS
      3d. Kitchen            3e. CRM     3f. Dashboard & helpers
-->
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
<style>
  [x-cloak]{display:none!important}
  :root{--brand:#0f766e;--brand-d:#115e59;--brand-l:#e6f6f4;--gold:#d97706;--gold-l:#fef3c7}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .bg-brand{background:var(--brand)}.bg-brand-d{background:var(--brand-d)}.bg-brand-l{background:var(--brand-l)}
  .text-brand{color:var(--brand)}.border-brand{border-color:var(--brand)}.bg-gold{background:var(--gold)}.bg-gold-l{background:var(--gold-l)}.text-gold{color:var(--gold)}
  .sidebar{background:linear-gradient(180deg,#0b3b38 0%,#0c2629 100%)}
  .hero{background:linear-gradient(135deg,#0f766e 0%,#115e59 55%,#134e4a 100%)}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .input{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:.55rem .75rem;background:#fff;font-size:.9rem;outline:none;transition:.15s}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
  .label{display:block;font-size:.68rem;font-weight:700;color:#6b7280;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:10px;padding:.55rem 1rem;font-weight:600;font-size:.875rem;transition:.15s;white-space:nowrap;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-d)}
  .btn-ghost{background:#fff;border:1px solid #d1d5db;color:#374151}.btn-ghost:hover{background:#f9fafb}
  .btn-danger{background:#fee2e2;color:#b91c1c}.btn-danger:hover{background:#fecaca}
  .btn-sm{padding:.3rem .65rem;font-size:.75rem;border-radius:8px}
  .badge{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .55rem;border-radius:999px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .tbl{width:100%;font-size:.85rem}
  .tbl th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;font-weight:700;text-align:left;padding:.7rem .9rem;background:#f9fafb;white-space:nowrap}
  .tbl td{padding:.65rem .9rem;border-top:1px solid #f1f5f9;vertical-align:middle}
  .tbl tbody tr:hover{background:#fafafa}
  .fade-in{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .nav-link{display:flex;align-items:center;gap:.65rem;padding:.5rem .75rem;border-radius:10px;font-size:.875rem;color:rgba(255,255,255,.75);transition:.15s;width:100%;text-align:left}
  .nav-link:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-link.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
  .nav-link.locked{opacity:.38}
  .scroll-thin::-webkit-scrollbar{width:6px;height:6px}.scroll-thin::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:6px}
  .phone{border:10px solid #111827;border-radius:38px;box-shadow:0 25px 50px -12px rgba(0,0,0,.35);overflow:hidden;background:#fff}
  .wa-bg{background-color:#efe7dd;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
  .wa-bubble{background:#d9fdd3;border-radius:10px 0 10px 10px;box-shadow:0 1px .5px rgba(0,0,0,.13);white-space:pre-wrap;word-break:break-word}
  .star{font-size:2rem;line-height:1;cursor:pointer;transition:transform .1s}.star:active{transform:scale(1.2)}
  .shift-cell{min-width:3.6rem}
  .pulse-dot{animation:pulse 1.6s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body class="bg-gray-100 text-gray-800">
<div x-data="app()" x-cloak class="flex h-screen overflow-hidden">

  <!-- ============ MOBILE BACKDROP ============ -->
  <div x-show="sidebarOpen" @click="sidebarOpen=false" class="fixed inset-0 bg-black bg-opacity-40 z-30 md:hidden"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside :class="sidebarOpen?'translate-x-0':'-translate-x-full'" class="sidebar fixed inset-y-0 left-0 z-40 w-64 transform transition-transform duration-200 md:translate-x-0 md:static md:flex-shrink-0 flex flex-col text-white">
    <div class="px-5 py-5 flex items-center gap-3 border-b border-white border-opacity-10">
      <div class="w-10 h-10 rounded-xl bg-gold flex items-center justify-center font-black text-lg text-white shadow">P</div>
      <div>
        <div class="font-bold tracking-wide">Phinik Oasis</div>
        <div class="text-xs text-white text-opacity-60">Operations Suite</div>
      </div>
      <button class="ml-auto md:hidden text-white text-opacity-70" @click="sidebarOpen=false">✕</button>
    </div>
    <nav class="flex-1 overflow-y-auto scroll-thin px-3 py-4 space-y-5">
      <template x-for="g in navGroups" :key="g.name">
        <div>
          <div class="px-3 mb-1 text-xs font-bold uppercase tracking-wider text-white text-opacity-40" x-text="g.name"></div>
          <template x-for="n in g.items" :key="n.id">
            <button @click="go(n.id)" class="nav-link" :class="{'active':view===n.id,'locked':!can(n.id)}">
              <span x-html="ico(n.icon)"></span>
              <span class="flex-1" x-text="n.label"></span>
              <span x-show="!can(n.id)" class="text-xs">🔒</span>
              <span x-show="n.id==='feedback' && can(n.id) && fbCount('new')>0" class="badge bg-red-500 text-white" x-text="fbCount('new')"></span>
            </button>
          </template>
        </div>
      </template>
    </nav>
    <div class="p-4 border-t border-white border-opacity-10 space-y-3 text-xs">
      <div class="rounded-lg bg-white bg-opacity-10 p-3 leading-relaxed">
        <div class="font-semibold text-white">Billing → Petpooja</div>
        <div class="text-white text-opacity-60">This suite never creates bills or touches POS data.</div>
      </div>
      <div class="flex items-center justify-between text-white text-opacity-60">
        <span x-text="persistOk?'● Auto-saved':'● Session only'" :class="persistOk?'text-green-300':'text-yellow-300'"></span>
        <button @click="resetDemo()" class="underline hover:text-white" x-text="resetArmed?'Click again to confirm':'Reset demo data'"></button>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN COLUMN ============ -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top bar with RBAC switcher -->
    <header class="bg-white border-b border-gray-200 z-20">
      <div class="flex items-center gap-3 px-4 md:px-6 py-3">
        <button class="md:hidden p-2 -ml-2 rounded-lg hover:bg-gray-100" @click="sidebarOpen=true" aria-label="Open menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="min-w-0">
          <h1 class="text-lg font-bold truncate" x-text="currentNav.label"></h1>
          <p class="text-xs text-gray-500 hidden sm:block" x-text="dateLabel"></p>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <div class="hidden sm:flex bg-gray-100 rounded-lg p-1 text-sm">
            <template x-for="r in ['admin','manager','staff']" :key="r">
              <button @click="quickRole(r)" class="px-3 py-1 rounded-md transition" :class="session.role===r?'bg-white shadow text-brand font-semibold':'text-gray-600 hover:text-gray-900'" x-text="{admin:'Owner',manager:'Manager',staff:'Staff'}[r]"></button>
            </template>
          </div>
          <select class="input py-1 text-sm" style="width:12.5rem" @change="setRole($event.target.value)" aria-label="Switch user">
            <optgroup label="Owner / Admin"><option value="admin" :selected="roleKey==='admin'">Pawan — Owner</option></optgroup>
            <optgroup label="Manager"><option value="manager:s1" :selected="roleKey==='manager:s1'">Rohit Sharma — Manager</option></optgroup>
            <optgroup label="Staff">
              <template x-for="s in db.staff.filter(x=>x.role!=='Manager' && x.active)" :key="s.id">
                <option :value="'staff:'+s.id" :selected="roleKey==='staff:'+s.id" x-text="s.name+' — '+(s.title||s.role)"></option>
              </template>
            </optgroup>
          </select>
          <div class="hidden sm:flex w-9 h-9 rounded-full items-center justify-center text-white text-sm font-bold" :class="{'bg-gold':isAdmin,'bg-purple-600':isManager,'bg-blue-600':isStaff}" x-text="initials(userName)"></div>
        </div>
      </div>
      <div class="px-4 md:px-6 py-1.5 text-xs flex items-center gap-2 border-t" :class="{'bg-gold-l text-yellow-900':isAdmin,'bg-purple-50 text-purple-900':isManager,'bg-blue-50 text-blue-900':isStaff}">
        <span class="font-bold" x-text="'Viewing as '+userName+' · '+roleLabel"></span>
        <span class="hidden md:inline opacity-75" x-text="'— '+roleBlurb"></span>
      </div>
    </header>

    <main x-ref="main" class="flex-1 overflow-y-auto scroll-thin pb-24 md:pb-10">
      <div class="p-4 md:p-6 max-w-7xl mx-auto">

<!-- =====================================================================
     ACCESS GUARD
===================================================================== -->
<template x-if="!can(view)">
  <div class="card p-10 text-center fade-in">
    <div class="text-4xl mb-2">🔒</div>
    <h2 class="text-xl font-bold">Restricted module</h2>
    <p class="text-gray-500 mt-1">Your role doesn't have access to this area.</p>
    <button class="btn btn-primary mt-4" @click="go('dashboard')">Back to dashboard</button>
  </div>
</template>

<!-- =====================================================================
     DASHBOARD — Owner / Manager
===================================================================== -->
<template x-if="view==='dashboard' && !isStaff">
<div class="space-y-6 fade-in">
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold"><span x-text="greet"></span>, <span x-text="userName.split(' ')[0]"></span></h2>
      <p class="text-gray-500 text-sm">Operations snapshot for Phinik Oasis · sales & billing live in Petpooja</p>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" @click="go('purchases')">+ Log purchase</button>
      <button class="btn btn-ghost btn-sm" @click="go('waste')">+ Log waste</button>
      <button class="btn btn-primary btn-sm" @click="go('rota')">Open rota</button>
    </div>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
    <template x-for="k in kpis" :key="k.label">
      <div class="card p-4">
        <p class="text-xs uppercase tracking-wide text-gray-500 font-semibold" x-text="k.label"></p>
        <p class="text-2xl font-bold mt-1" :class="k.cls||''" x-text="k.value"></p>
        <p class="text-xs text-gray-500 mt-1" x-text="k.sub"></p>
      </div>
    </template>
  </div>

  <div class="grid lg:grid-cols-3 gap-4">
    <!-- Admin: weekly spend chart -->
    <div x-show="isAdmin" class="card p-5 lg:col-span-2">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold">Procurement spend · last 4 weeks</h3>
        <span class="text-xs text-gray-500">Owner-only financial summary</span>
      </div>
      <div class="flex items-end gap-4 h-48">
        <template x-for="(w,i) in weeklySpend" :key="i">
          <div class="flex-1 flex flex-col items-center justify-end h-full">
            <span class="text-xs font-bold mb-1" x-text="inrK(w.total)"></span>
            <div class="w-full flex flex-col-reverse rounded-t-lg overflow-hidden" :style="`height:${w.total/maxWeekSpend*82}%`">
              <template x-for="c in cats" :key="c">
                <div :style="`height:${w.total?(w.byCat[c]||0)/w.total*100:0}%;background:${catColor[c]}`" :title="c+': '+inr(w.byCat[c]||0)"></div>
              </template>
            </div>
            <span class="text-xs text-gray-500 mt-2" x-text="w.label"></span>
          </div>
        </template>
      </div>
      <div class="flex flex-wrap gap-3 mt-4 text-xs">
        <template x-for="c in cats" :key="c"><span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block" :style="`background:${catColor[c]}`"></span><span x-text="c"></span></span></template>
      </div>
    </div>

    <!-- Manager: on shift today (wide) / Admin: small -->
    <div class="card p-5" :class="isManager?'lg:col-span-2':''">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold">On shift today</h3>
        <button class="text-xs text-brand font-semibold" @click="go('attendance')">Attendance →</button>
      </div>
      <div class="divide-y">
        <template x-for="s in scheduledToday" :key="s.id">
          <div class="flex items-center gap-3 py-2">
            <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-xs font-bold" x-text="initials(s.name)"></div>
            <div class="flex-1 min-w-0"><div class="text-sm font-medium truncate" x-text="s.name"></div><div class="text-xs text-gray-500" x-text="SHIFTS[shiftOf(today,s.id)].label+' · '+SHIFTS[shiftOf(today,s.id)].start+'–'+SHIFTS[shiftOf(today,s.id)].end"></div></div>
            <span class="badge" :class="{'bg-green-100 text-green-800':attStatus(s.id).k==='on','bg-gray-100 text-gray-600':attStatus(s.id).k==='off','bg-blue-100 text-blue-800':attStatus(s.id).k==='done'}" x-text="attStatus(s.id).short"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Inflation alerts -->
    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold">Price alerts <span class="text-xs font-normal text-gray-500">(&gt;5% week-on-week)</span></h3>
        <button class="text-xs text-brand font-semibold" @click="go('prices')">Tracker →</button>
      </div>
      <template x-if="!inflationAlerts.length"><p class="text-sm text-gray-500">No significant price rises this week. 🎉</p></template>
      <div class="space-y-2">
        <template x-for="r in inflationAlerts.slice(0,5)" :key="r.it.name">
          <div class="flex items-center justify-between text-sm">
            <span><span class="font-medium" x-text="r.it.name"></span> <span class="text-gray-400 text-xs" x-text="inr2(r.latest)+'/'+r.it.unit"></span></span>
            <span class="badge bg-red-100 text-red-700" x-text="'▲ '+r.wow.toFixed(1)+'%'"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Waste by reason -->
    <div class="card p-5">
      <h3 class="font-bold mb-3">Waste by reason · 7 days</h3>
      <div class="space-y-3">
        <template x-for="w in wasteByReason" :key="w.reason">
          <div>
            <div class="flex justify-between text-xs mb-1"><span class="font-medium" x-text="w.reason+' ('+w.n+')'"></span><span x-text="inr(w.cost)"></span></div>
            <div class="h-2 rounded-full bg-gray-100"><div class="h-2 rounded-full bg-red-400" :style="`width:${w.pct}%`"></div></div>
          </div>
        </template>
      </div>
    </div>

    <!-- Latest feedback -->
    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold">Latest private feedback</h3>
        <button class="text-xs text-brand font-semibold" @click="go('feedback')">Inbox →</button>
      </div>
      <div class="space-y-3">
        <template x-for="f in sortedFeedback.slice(0,4)" :key="f.id">
          <button class="w-full text-left" @click="fb.sel=f.id; go('feedback')">
            <div class="flex items-center justify-between"><span class="text-yellow-500 text-sm" x-text="stars(f.rating)"></span><span class="badge" :class="statusCls(f.status)" x-text="statusLabel(f.status)"></span></div>
            <p class="text-sm text-gray-700 truncate" x-text="f.message"></p>
            <p class="text-xs text-gray-400" x-text="f.table+' · '+fmtDate(f.date)+' · '+(f.name||'Anonymous')"></p>
          </button>
        </template>
      </div>
    </div>

    <!-- Activity log (Admin) -->
    <div x-show="isAdmin" class="card p-5">
      <h3 class="font-bold mb-3">Activity log</h3>
      <div class="space-y-2 max-h-64 overflow-y-auto scroll-thin">
        <template x-for="(a,i) in db.activity.slice(0,20)" :key="i">
          <div class="text-xs"><span class="text-gray-400" x-text="a.at"></span> · <span class="font-semibold" x-text="a.who"></span> <span class="text-gray-600" x-text="a.text"></span></div>
        </template>
      </div>
    </div>
  </div>
</div>
</template>

<!-- =====================================================================
     DASHBOARD — Staff "My Day" (mobile-first)
===================================================================== -->
<template x-if="view==='dashboard' && isStaff && me">
<div class="max-w-xl mx-auto space-y-4 fade-in">
  <div class="hero rounded-2xl p-5 text-white shadow-lg">
    <p class="text-sm text-white text-opacity-75" x-text="greet+','"></p>
    <h2 class="text-2xl font-bold" x-text="me.name"></h2>
    <p class="text-sm text-white text-opacity-75" x-text="(me.title||me.role)+' · '+dateLabel"></p>
    <div class="mt-4 bg-white bg-opacity-10 rounded-xl p-3 flex items-center justify-between">
      <div>
        <div class="text-xs uppercase tracking-wide text-white text-opacity-60">Today's shift</div>
        <div class="font-bold text-lg" x-text="shiftOf(today,me.id)?SHIFTS[shiftOf(today,me.id)].label+' · '+SHIFTS[shiftOf(today,me.id)].start+'–'+SHIFTS[shiftOf(today,me.id)].end:'Day off 🌿'"></div>
      </div>
      <div class="text-right"><div class="text-xs text-white text-opacity-60">Now</div><div class="font-mono text-lg" x-text="clock"></div></div>
    </div>
  </div>

  <button @click="openRecord(me.id)?checkOut(me.id):checkIn(me.id)" class="w-full text-white rounded-2xl py-6 shadow-lg transition transform hover:scale-105" :class="openRecord(me.id)?'bg-red-600':'bg-brand'">
    <span class="block text-2xl font-bold" x-text="openRecord(me.id)?'Check Out':'Check In'"></span>
    <span class="block text-sm opacity-80" x-text="attStatus(me.id).t"></span>
  </button>

  <div class="grid grid-cols-3 gap-3">
    <div class="card p-3 text-center"><div class="text-xl font-bold" x-text="hoursRange(me.id,ymd(weekStart(now)),today).toFixed(1)"></div><div class="text-xs text-gray-500">hours this week</div></div>
    <div class="card p-3 text-center"><div class="text-xl font-bold" x-text="db.attendance.filter(a=>a.staffId===me.id&&a.date>=ymd(weekStart(now))).length"></div><div class="text-xs text-gray-500">shifts worked</div></div>
    <div class="card p-3 text-center"><div class="text-xl font-bold text-green-600" x-text="inr(hoursRange(me.id,ymd(weekStart(now)),today)*tips.rate)"></div><div class="text-xs text-gray-500">est. incentive</div></div>
  </div>

  <div class="card p-4">
    <h3 class="font-bold mb-2">My next 7 days</h3>
    <div class="divide-y">
      <template x-for="u in myUpcoming" :key="u.d">
        <div class="flex items-center justify-between py-2 text-sm">
          <span :class="u.d===today?'font-bold text-brand':''" x-text="dow(u.d)+', '+fmtDate(u.d)+(u.d===today?' (today)':'')"></span>
          <span class="badge border" :class="u.sh?SHIFTS[u.sh].cls:'bg-gray-50 text-gray-400'" x-text="u.sh?SHIFTS[u.sh].label+' '+SHIFTS[u.sh].start+'–'+SHIFTS[u.sh].end:'Off'"></span>
        </div>
      </template>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <button class="card p-4 text-left hover:shadow-md transition" @click="go('waste')"><div class="text-2xl">🗑️</div><div class="font-bold mt-1">Log waste</div><div class="text-xs text-gray-500">Spoilage, over-prep, returns</div></button>
    <button class="card p-4 text-left hover:shadow-md transition" @click="go('qr')"><div class="text-2xl">📱</div><div class="font-bold mt-1">Guest QR</div><div class="text-xs text-gray-500">Help a guest leave feedback</div></button>
  </div>
</div>
</template>

<!-- =====================================================================
     EMS · STAFF DIRECTORY
===================================================================== -->
<template x-if="view==='staff' && can('staff')">
<div class="space-y-4 fade-in">
  <div class="flex flex-wrap gap-2 items-center">
    <input class="input" style="max-width:16rem" placeholder="Search name or phone…" x-model="dir.q">
    <select class="input" style="max-width:10rem" x-model="dir.role"><option>All</option><option>Manager</option><option>Waiter</option><option>Chef</option><option>Cleaner</option></select>
    <div class="ml-auto flex items-center gap-3">
      <span class="text-sm text-gray-500" x-text="dirRows.length+' staff'"></span>
      <button x-show="isAdmin" class="btn btn-primary" @click="dir.showForm=!dir.showForm" x-text="dir.showForm?'Close':'+ Add staff'"></button>
    </div>
  </div>

  <div x-show="!isAdmin" class="rounded-lg bg-purple-50 border border-purple-200 text-purple-900 text-sm px-4 py-2">🔒 Wage & salary details are visible to the Owner only.</div>

<script>
/* ==========================================================================
   1. UTILITIES & CONSTANTS
========================================================================== */
const STORE_KEY = 'phinik-oasis-demo-v1';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }; // Monday
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const uid = p => p + Math.random().toString(36).slice(2, 9);
/** Deterministic PRNG so mock data is stable between resets */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/** Shift definitions used by the rota, attendance & lateness checks */
const SHIFTS = {
  M: { label: 'Morning', start: '10:00', end: '16:00', hours: 6,  cls: 'bg-yellow-100 text-yellow-800 border-yellow-300' },
  E: { label: 'Evening', start: '16:00', end: '23:00', hours: 7,  cls: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
  D: { label: 'Double',  start: '10:00', end: '23:00', hours: 12, cls: 'bg-purple-100 text-purple-800 border-purple-300' },
};

/** Latest unit price for an item = most recent purchase (falls back to catalogue base) */
function latestPrice(db, name) {
  let best = null;
  for (const p of db.purchases) {
    if (p.item !== name) continue;
    if (!best || p.date > best.date || (p.date === best.date && (p.ts || 0) > (best.ts || 0))) best = p;
  }
  if (best) return best.price / best.qty;
  const it = db.items.find(i => i.name === name);
  return it ? it.base : 0;
}

/* Storage adapter — artifact environment provides window.storage.
   Replace with localStorage / fetch('/api/state') when self-hosting. */
const Store = {
  async load() { if (!window.storage) return null; try { const r = await window.storage.get(STORE_KEY, false); return r && r.value ? JSON.parse(r.value) : null; } catch (e) { return null; } },
  async save(data) { if (!window.storage) return false; try { const r = await window.storage.set(STORE_KEY, JSON.stringify(data), false); return !!r; } catch (e) { return false; } },
};

/* ==========================================================================
   2. SEED / MOCK DATA (dates are generated relative to "today")
========================================================================== */
function seed() {
  const r = rng(20260929);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const T = ymd(today);
  const ws = weekStart(today);
  const nowH = new Date().getHours();

  const staff = [
    { id: 's1', name: 'Rohit Sharma', role: 'Manager', title: 'Restaurant Manager', phone: '98110 45621', joined: '2022-03-14', salary: 32000, active: true },
    { id: 's2', name: 'Amit Kumar',   role: 'Waiter',  title: 'Senior Waiter', phone: '98730 11209', joined: '2023-07-01', salary: 14500, active: true },
    { id: 's3', name: 'Priya Singh',  role: 'Waiter',  title: 'Waiter', phone: '98990 34812', joined: '2024-01-18', salary: 14000, active: true },
    { id: 's4', name: 'Sameer Khan',  role: 'Waiter',  title: 'Waiter', phone: '97180 55230', joined: '2025-05-06', salary: 13500, active: true },
    { id: 's5', name: 'Ravi Verma',   role: 'Chef',    title: 'Head Chef', phone: '98112 70045', joined: '2021-11-02', salary: 30000, active: true },
    { id: 's6', name: 'Deepak Yadav', role: 'Chef',    title: 'Line Cook', phone: '98184 22917', joined: '2023-09-12', salary: 18000, active: true },
    { id: 's7', name: 'Imran Ali',    role: 'Chef',    title: 'Tandoor Chef', phone: '98713 60482', joined: '2022-08-20', salary: 21000, active: true },
    { id: 's8', name: 'Sunita Devi',  role: 'Cleaner', title: 'Housekeeping', phone: '96500 18834', joined: '2023-02-10', salary: 11000, active: true },
    { id: 's9', name: 'Mohan Lal',    role: 'Cleaner', title: 'Dishwasher', phone: '95400 77261', joined: '2024-06-25', salary: 10500, active: true },
  ];

  // ---- Rota: 2 weeks back to 3 weeks ahead, each person has one rotating off-day
  const base = { s1: 'M', s2: 'M', s3: 'E', s4: 'E', s5: 'E', s6: 'M', s7: 'E', s8: 'M', s9: 'E' };
  const rota = {};
  for (let i = -14; i < 21; i++) {
    const d = addDays(ws, i), key = ymd(d), dow = (d.getDay() + 6) % 7, wk = Math.floor((i + 14) / 7);
    rota[key] = {};
    staff.forEach((s, k) => {
      if ((k * 2 + dow) % 7 === 0) return; // day off
      let sh = base[s.id];
      if (s.role === 'Waiter' && wk % 2 === 1) sh = sh === 'M' ? 'E' : 'M';
      if (dow >= 5 && ['s1', 's2', 's5'].includes(s.id)) sh = 'D'; // weekend doubles
      rota[key][s.id] = sh;
    });
  }

  // ---- Attendance: last week + this week up to today
  const attendance = []; let ai = 1;
  for (let d = addDays(ws, -7); d <= today; d = addDays(d, 1)) {
    const key = ymd(d);
    staff.forEach(s => {
      const code = rota[key] && rota[key][s.id]; if (!code) return;
      if (r() < 0.04) return; // occasional absence
      const sh = SHIFTS[code];
      let inM = toMin(sh.start) - 12 + Math.floor(r() * 18);
      if (r() < 0.12) inM += 15 + Math.floor(r() * 20); // late arrival
      const outM = toMin(sh.end) - 5 + Math.floor(r() * 25);
      let out = fromMin(outM);
      if (key === T) {
        if (code === 'E' && nowH < 16) return;
        if (code === 'D' || code === 'E' || (code === 'M' && nowH < 16)) out = null;
      }
      attendance.push({ id: 'a' + ai++, staffId: s.id, date: key, in: fromMin(inM), out, by: 'Self' });
    });
  }

  // ---- Vendors & item catalogue
  const vendors = [
    { id: 'v1', name: 'Azadpur Fresh Veg Co.', cat: 'Vegetables', contact: 'Ramesh Gupta', phone: '98100 22341', terms: 'Cash on delivery', rating: 4 },
    { id: 'v6', name: 'Green Leaf Organics', cat: 'Vegetables', contact: 'Neeraj Bhatia', phone: '98734 11920', terms: '7-day credit', rating: 3 },
    { id: 'v2', name: 'Shree Krishna Dairy', cat: 'Dairy', contact: 'Mukesh Yadav', phone: '98991 55620', terms: 'Weekly credit', rating: 5 },
    { id: 'v3', name: 'Al-Kareem Meat House', cat: 'Meat', contact: 'Salim Qureshi', phone: '98183 77410', terms: 'Cash on delivery', rating: 4 },
    { id: 'v4', name: 'Delhi LPG Suppliers', cat: 'Gas', contact: 'Harish Chand', phone: '98711 90032', terms: 'Advance payment', rating: 3 },
    { id: 'v5', name: 'Khari Baoli Spice Traders', cat: 'Dry Goods', contact: 'Anil Jain', phone: '98115 66780', terms: '15-day credit', rating: 4 },
  ];
  const vendorFor = { Vegetables: 'v1', Dairy: 'v2', Meat: 'v3', Gas: 'v4', 'Dry Goods': 'v5' };
  // trend = weekly price drift used to create realistic inflation signals
  const items = [
    { name: 'Onion', unit: 'kg', cat: 'Vegetables', base: 32, qty: 25, trend: 0.05, freq: [0, 3] },
    { name: 'Tomato', unit: 'kg', cat: 'Vegetables', base: 38, qty: 20, trend: 0.09, freq: [0, 3] },
    { name: 'Potato', unit: 'kg', cat: 'Vegetables', base: 24, qty: 20, trend: 0, freq: [0, 3] },
    { name: 'Coriander', unit: 'kg', cat: 'Vegetables', base: 90, qty: 2, trend: -0.04, freq: [0, 3] },
    { name: 'Paneer', unit: 'kg', cat: 'Dairy', base: 380, qty: 8, trend: 0.02, freq: [0, 2, 4] },
    { name: 'Milk', unit: 'L', cat: 'Dairy', base: 64, qty: 20, trend: 0, freq: [0, 2, 4] },
    { name: 'Butter', unit: 'kg', cat: 'Dairy', base: 520, qty: 3, trend: 0.015, freq: [0, 4] },
    { name: 'Cream', unit: 'L', cat: 'Dairy', base: 240, qty: 4, trend: 0, freq: [0, 4] },
    { name: 'Chicken', unit: 'kg', cat: 'Meat', base: 230, qty: 15, trend: -0.02, freq: [1, 4] },
    { name: 'Mutton', unit: 'kg', cat: 'Meat', base: 720, qty: 6, trend: 0.012, freq: [1, 4] },
    { name: 'LPG Cylinder (19 kg)', unit: 'cyl', cat: 'Gas', base: 1780, qty: 3, trend: 0.01, freq: [2] },
    { name: 'Basmati Rice', unit: 'kg', cat: 'Dry Goods', base: 110, qty: 25, trend: 0.01, freq: [0] },
    { name: 'Cooking Oil', unit: 'L', cat: 'Dry Goods', base: 145, qty: 15, trend: 0.02, freq: [0] },
    { name: 'Garam Masala', unit: 'kg', cat: 'Dry Goods', base: 900, qty: 1, trend: 0, freq: [0] },
  ];

  // ---- Purchases: 4 weeks of history
  const purchases = []; let ts = 1;
  for (let d = addDays(ws, -21); d <= today; d = addDays(d, 1)) {
    const dow = (d.getDay() + 6) % 7;
    const wAgo = Math.round((ws - weekStart(d)) / (7 * 864e5));
    items.forEach(it => {
      if (!it.freq.includes(dow)) return;
      if (it.cat === 'Dry Goods' && wAgo % 2 === 1) return;
      let vid = vendorFor[it.cat], mult = 1;
      if (it.cat === 'Vegetables' && r() < 0.3) { vid = 'v6'; mult = 1.07; }
      const unitP = it.base * (1 + it.trend * (3 - wAgo)) * (1 + (r() - 0.5) * 0.05) * mult;
      let qty = it.qty * (0.8 + r() * 0.4);
      qty = it.unit === 'cyl' ? Math.max(1, Math.round(qty)) : Math.round(qty * 2) / 2;
      purchases.push({ id: 'p' + ts, ts: ts++, date: ymd(d), vendorId: vid, item: it.name, qty, unit: it.unit, price: Math.round(unitP * qty), notes: '', by: 's1' });
    });
  }

  // ---- Recipes (menu item -> raw ingredients per plate)
  const recipes = [
    { id: 'r1', name: 'Paneer Butter Masala', category: 'Main Course · Veg', price: 340, ing: [{ item: 'Paneer', qty: 0.2 }, { item: 'Butter', qty: 0.03 }, { item: 'Cream', qty: 0.04 }, { item: 'Tomato', qty: 0.18 }, { item: 'Onion', qty: 0.08 }, { item: 'Garam Masala', qty: 0.005 }, { item: 'Cooking Oil', qty: 0.02 }] },
    { id: 'r2', name: 'Butter Chicken', category: 'Main Course · Non-Veg', price: 420, ing: [{ item: 'Chicken', qty: 0.25 }, { item: 'Butter', qty: 0.04 }, { item: 'Cream', qty: 0.05 }, { item: 'Tomato', qty: 0.2 }, { item: 'Garam Masala', qty: 0.006 }, { item: 'Cooking Oil', qty: 0.02 }] },
    { id: 'r3', name: 'Veg Dum Biryani', category: 'Rice & Biryani', price: 290, ing: [{ item: 'Basmati Rice', qty: 0.16 }, { item: 'Onion', qty: 0.1 }, { item: 'Potato', qty: 0.08 }, { item: 'Cooking Oil', qty: 0.03 }, { item: 'Garam Masala', qty: 0.005 }, { item: 'Coriander', qty: 0.01 }] },
    { id: 'r4', name: 'Mutton Rogan Josh', category: 'Main Course · Non-Veg', price: 520, ing: [{ item: 'Mutton', qty: 0.25 }, { item: 'Onion', qty: 0.12 }, { item: 'Tomato', qty: 0.06 }, { item: 'Cooking Oil', qty: 0.04 }, { item: 'Garam Masala', qty: 0.008 }] },
    { id: 'r5', name: 'Jeera Aloo', category: 'Sides', price: 220, ing: [{ item: 'Potato', qty: 0.25 }, { item: 'Cooking Oil', qty: 0.03 }, { item: 'Coriander', qty: 0.01 }, { item: 'Garam Masala', qty: 0.003 }] },
  ];

  const db = { v: 1, staff, rota, attendance, vendors, items, purchases, recipes, waste: [], feedback: [], contacts: [], campaigns: [], activity: [] };

  // ---- Waste log
  const plate = rid => { const rc = recipes.find(x => x.id === rid); return rc.ing.reduce((t, g) => t + g.qty * latestPrice(db, g.item), 0); };
  const wasteSeed = [
    [0, 'raw', 'Tomato', 1.5, 'Spoilage', 's6', 'Soft & bruised batch'], [1, 'raw', 'Paneer', 0.4, 'Expired', 's5', ''],

    { id: 'f4', date: fd(2), time: '14:30', table: 'T11', rating: 4, category: 'Service', message: 'Priya was very attentive. Would love to see more vegetarian starters on the menu.', name: 'Kavita Rao', phone: '9711223344', optIn: true, status: 'new', replies: [], publicOk: false },
    { id: 'f5', date: fd(3), time: '21:48', table: 'T6', rating: 1, category: 'Food', message: 'Butter chicken was too salty and arrived lukewarm.', name: 'Vikram S.', phone: '9988776655', optIn: true, status: 'resolved', replies: [{ by: 'Pawan', text: 'Vikram ji, sincere apologies. We have recalibrated the recipe — your next butter chicken is on the house.', at: fd(3) + ' 22:30' }], publicOk: false },

  ];

  // ---- CRM contacts (WhatsApp opt-in list)
  const contacts = [
    ['Neha Kapoor', '9899012345', 0, 2, true], ['Arjun Mehta', '9810098100', 1, 9, true], ['Kavita Rao', '9711223344', 2, 1, true],
    ['Vikram S.', '9988776655', 3, 3, true], ['Sanjay Gupta', '9654321098', 5, 6, true], ['Meera Iyer', '9876501234', 41, 4, true],
    ['Rahul Bansal', '9810234567', 62, 7, true], ['Anjali Verma', '9899876543', 12, 1, true], ['Karan Malhotra', '9811122233', 35, 2, true],
    ['Pooja Sethi', '9717345678', 8, 5, false],
  ];
  db.contacts = contacts.map(([name, phone, lv, visits, optIn]) => ({ name, phone, lastVisit: fd(lv), visits, optIn }));
  db.activity = [{ at: T + ' 09:00', who: 'System', text: 'loaded demo data' }];

}

/* ==========================================================================

function app() {

    // --- constants
    cats: ['Vegetables', 'Dairy', 'Meat', 'Gas', 'Dry Goods'],

    wasteReasons: ['Spoilage', 'Over-prep', 'Burnt / cooking error', 'Customer return', 'Expired', 'Dropped / spilled'],

    waTypes: { festive: 'Festival offer', weekend: 'Weekend special', newmenu: 'New menu launch', winback: 'Win-back (we miss you)', recovery: 'Service recovery', birthday: 'Birthday month' },
    waHeadlines: { festive: 'Diwali Dhamaka Dinner', weekend: 'Weekend Grand Buffet', newmenu: 'New Tandoor Specials', winback: 'We Miss You!', recovery: 'A Little Something to Make It Right', birthday: 'Birthday Month Treat' },
    waSegments: { all: 'All opted-in', regular: 'Regulars (5+ visits)', lapsed: 'Lapsed (30+ days)', new: 'First-timers', complaint: 'Recent complainants' },

    /* ---- RBAC: every module declares which roles may open it ---- */
    nav: [
      { id: 'dashboard', label: 'Dashboard', short: 'Home', icon: 'home', group: 'Overview', roles: ['admin', 'manager', 'staff'] },
      { id: 'staff', label: 'Staff Directory', short: 'Staff', icon: 'users', group: 'EMS · Staff', roles: ['admin', 'manager'] },
      { id: 'rota', label: 'Shift Rota', short: 'Rota', icon: 'calendar', group: 'EMS · Staff', roles: ['admin', 'manager', 'staff'] },
      { id: 'attendance', label: 'Check-in / Out', short: 'Check-in', icon: 'clock', group: 'EMS · Staff', roles: ['admin', 'manager', 'staff'] },
      { id: 'tips', label: 'Tips & Incentives', short: 'Tips', icon: 'cash', group: 'EMS · Staff', roles: ['admin', 'manager'] },
      { id: 'vendors', label: 'Vendors', short: 'Vendors', icon: 'store', group: 'PMS · Procurement', roles: ['admin', 'manager'] },
      { id: 'purchases', label: 'Purchase Orders', short: 'Purchases', icon: 'clipboard', group: 'PMS · Procurement', roles: ['admin', 'manager'] },
      { id: 'prices', label: 'Price Tracker', short: 'Prices', icon: 'trending', group: 'PMS · Procurement', roles: ['admin', 'manager'] },
      { id: 'recipes', label: 'Recipe Costing', short: 'Recipes', icon: 'book', group: 'Kitchen Intelligence', roles: ['admin', 'manager'] },
      { id: 'waste', label: 'Waste Log', short: 'Waste', icon: 'trash', group: 'Kitchen Intelligence', roles: ['admin', 'manager', 'staff'] },
      { id: 'feedback', label: 'Feedback Inbox', short: 'Feedback', icon: 'chat', group: 'CRM · Guests', roles: ['admin', 'manager'] },
      { id: 'whatsapp', label: 'WhatsApp Campaigns', short: 'WhatsApp', icon: 'speaker', group: 'CRM · Guests', roles: ['admin', 'manager'] },
      { id: 'qr', label: 'Table QR · Guest view', short: 'QR', icon: 'qr', group: 'CRM · Guests', roles: ['admin', 'manager', 'staff'] },
    ],

    /* ---------------- lifecycle ---------------- */
    async init() {
      const saved = await Store.load();
      if (saved && saved.v === 1) this.db = saved;
      this.persistOk = !!window.storage;
      this.$watch('db', () => this.queueSave());
      this.$watch('po.form.vendorId', () => { const it = this.poItems; if (!it.find(i => i.name === this.po.form.item)) this.po.form.item = it[0] ? it[0].name : ''; });
      this.$watch('wa.type', t => { this.wa.headline = this.waHeadlines[t]; if (t === 'recovery') this.wa.segment = 'complaint'; });
      setInterval(() => { this.now = new Date(); }, 15000);
    },
    queueSave() {
      clearTimeout(this._saveTimer);
      this._saveTimer = setTimeout(async () => { this.persistOk = await Store.save(this.db); }, 400);
    },
    resetDemo() {
      if (!this.resetArmed) { this.resetArmed = true; setTimeout(() => this.resetArmed = false, 3000); return; }
      this.resetArmed = false; this.db = seed(); this.view = 'dashboard'; this.toast('Demo data reset', 'info');
    },

    /* ================= 3a. SESSION & RBAC ================= */
    get isAdmin() { return this.session.role === 'admin'; },
    get isManager() { return this.session.role === 'manager'; },
    get isStaff() { return this.session.role === 'staff'; },
    get me() { return this.db.staff.find(s => s.id === this.session.staffId); },
    get userName() { return this.isAdmin ? 'Pawan' : (this.me ? this.me.name : '—'); },
    get roleKey() { return this.isAdmin ? 'admin' : this.session.role + ':' + this.session.staffId; },
    get roleLabel() { return { admin: 'Owner / Admin', manager: 'Manager', staff: 'Staff' }[this.session.role]; },
    get roleBlurb() {
      return {
        admin: 'Full access · financial summaries · wages · recipe margins · delete rights',
        manager: 'Assign shifts · log purchases · manage vendors, waste & feedback · no wages or P&L',
        staff: 'Own shifts only · self check-in/out · log waste · guest QR demo',
      }[this.session.role];
    },
    setRole(v) {
      if (v === 'admin') this.session = { role: 'admin', staffId: null };
      else { const [r, id] = v.split(':'); this.session = { role: r, staffId: id }; if (r === 'staff') this.lastStaff = id; }
      if (!this.can(this.view)) this.view = 'dashboard';
      this.sidebarOpen = false;
      this.toast('Switched to ' + this.userName + ' · ' + this.roleLabel, 'info');
    },
    quickRole(r) { this.setRole(r === 'admin' ? 'admin' : r === 'manager' ? 'manager:s1' : 'staff:' + this.lastStaff); },
    can(id) { const n = this.nav.find(x => x.id === id); return !!n && n.roles.includes(this.session.role); },
    go(id) {
      if (!this.can(id)) { this.toast('Locked for ' + this.roleLabel + ' role', 'error'); return; }
      this.view = id; this.sidebarOpen = false;
      if (this.$refs.main) this.$refs.main.scrollTop = 0;
    },
    get navGroups() {
      const g = [];
      this.nav.forEach(n => { let x = g.find(y => y.name === n.group); if (!x) { x = { name: n.group, items: [] }; g.push(x); } x.items.push(n); });
      return g;
    },
    get currentNav() { return this.nav.find(n => n.id === this.view) || this.nav[0]; },
    get mobileNav() {
      const m = { admin: ['dashboard', 'purchases', 'waste', 'feedback'], manager: ['dashboard', 'rota', 'purchases', 'feedback'], staff: ['dashboard', 'attendance', 'rota', 'waste'] };
      return m[this.session.role].map(id => this.nav.find(n => n.id === id));
    },

    /* ================= 3b. EMS ================= */
    hourly(s) { return s.salary / 208; }, // 26 days × 8 h
    get dirRows() {
      const q = this.dir.q.toLowerCase();
      return this.db.staff.filter(s => (this.dir.role === 'All' || s.role === this.dir.role) && (!q || s.name.toLowerCase().includes(q) || (s.phone || '').includes(q)));
    },
    addStaff() {
      const f = this.dir.form;
      if (!f.name.trim() || !(+f.salary > 0)) return this.toast('Name and salary are required', 'error');
      this.db.staff.push({ id: uid('s'), name: f.name.trim(), role: f.role, title: f.role, phone: f.phone, joined: this.today, salary: +f.salary, active: true });
      this.log('added staff member ' + f.name.trim());
      this.toast(f.name.trim() + ' added to directory');
      this.dir.form = { name: '', role: 'Waiter', phone: '', salary: '' }; this.dir.showForm = false;
    },
    // Rota
    get canEditRota() { return !this.isStaff; },
    get rotaDays() { const ws = addDays(weekStart(this.now), this.rotaWeek * 7); return [...Array(7)].map((_, i) => ymd(addDays(ws, i))); },
    get weekLabel() { const d = this.rotaDays; return this.fmtDate(d[0]) + ' – ' + this.fmtDate(d[6]); },
    get rotaStaff() { return this.isStaff ? this.db.staff.filter(s => s.id === this.session.staffId) : this.db.staff.filter(s => s.active); },
    shiftOf(date, sid) { return (this.db.rota[date] || {})[sid] || ''; },
    cycleShift(date, sid) {
      if (!this.canEditRota) return;
      const order = ['', 'M', 'E', 'D'];
      const nx = order[(order.indexOf(this.shiftOf(date, sid)) + 1) % 4];
      if (!this.db.rota[date]) this.db.rota[date] = {};
      if (nx) this.db.rota[date][sid] = nx; else delete this.db.rota[date][sid];
      this.db.rota = { ...this.db.rota }; // ensure reactivity for nested keys
    },
    weekHours(sid) { return this.rotaDays.reduce((t, d) => t + (this.shiftOf(d, sid) ? SHIFTS[this.shiftOf(d, sid)].hours : 0), 0); },
    weekHoursFor(sid, offset) { const ws = addDays(weekStart(this.now), offset * 7); let t = 0; for (let i = 0; i < 7; i++) { const c = this.shiftOf(ymd(addDays(ws, i)), sid); if (c) t += SHIFTS[c].hours; } return t; },
    cov(date, t, role) { return this.db.staff.filter(s => s.active && s.role === role && [t, 'D'].includes(this.shiftOf(date, s.id))).length; },
    copyPrevWeek() {
      const rota = { ...this.db.rota };
      this.rotaDays.forEach(d => { rota[d] = { ...(rota[ymd(addDays(parseYmd(d), -7))] || {}) }; });
      this.db.rota = rota; this.log('copied previous week rota into ' + this.weekLabel); this.toast('Previous week copied');
    },
    clearWeek() {
      const rota = { ...this.db.rota }; this.rotaDays.forEach(d => { rota[d] = {}; });
      this.db.rota = rota; this.log('cleared rota for ' + this.weekLabel); this.toast('Week cleared', 'info');
    },
    get myUpcoming() { if (!this.me) return []; return [...Array(7)].map((_, i) => ymd(addDays(this.now, i))).map(d => ({ d, sh: this.shiftOf(d, this.me.id) })); },
    // Attendance
    get clock() { return this.now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); },
    nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); },
    openRecord(sid) { return this.db.attendance.find(a => a.staffId === sid && !a.out); },
    checkIn(sid) {
      if (this.openRecord(sid)) return this.toast('Already checked in', 'error');
      this.now = new Date();
      const self = sid === this.session.staffId;
      this.db.attendance.push({ id: uid('a'), staffId: sid, date: this.today, in: this.nowHM(), out: null, by: self ? 'Self' : this.userName });
      const rec = this.openRecord(sid);
      this.toast(this.staffName(sid) + ' checked in at ' + rec.in + (this.isLate(rec) ? ' (late)' : ''), this.isLate(rec) ? 'info' : 'success');
      this.log('checked in ' + this.staffName(sid));
    },
    checkOut(sid) {
      const r = this.openRecord(sid); if (!r) return;
      r.out = this.nowHM(); this.now = new Date();
      this.toast(this.staffName(sid) + ' checked out · ' + this.hrs(r).toFixed(1) + ' h');
      this.log('checked out ' + this.staffName(sid));
    },
    hrs(a) { if (!a.out) return 0; let m = toMin(a.out) - toMin(a.in); if (m < 0) m += 1440; return m / 60; },
    liveHrs(a) {
      if (!a) return 0; if (a.out) return this.hrs(a);
      if (a.date !== this.today) return 0;
      return Math.max(0, toMin(pad(this.now.getHours()) + ':' + pad(this.now.getMinutes())) - toMin(a.in)) / 60;
    },
    isLate(a) { const sh = this.shiftOf(a.date, a.staffId); return !!sh && toMin(a.in) > toMin(SHIFTS[sh].start) + 10; },
    attStatus(sid) {
      const open = this.openRecord(sid);
      if (open) return { k: 'on', t: 'On duty since ' + open.in, short: 'On duty' };
      const done = this.db.attendance.find(a => a.staffId === sid && a.date === this.today && a.out);
      if (done) return { k: 'done', t: 'Done · ' + done.in + '–' + done.out, short: 'Done' };
      return { k: 'off', t: 'Not checked in yet', short: 'Not in' };
    },
    get scheduledToday() { return this.db.staff.filter(s => s.active && this.shiftOf(this.today, s.id)); },
    get onDutyNow() { return this.db.staff.filter(s => this.openRecord(s.id)).length; },
    get attendanceBoard() { return this.db.staff.filter(s => s.active).sort((a, b) => (this.shiftOf(this.today, b.id) ? 1 : 0) - (this.shiftOf(this.today, a.id) ? 1 : 0)); },
    get attLog() { return this.db.attendance.filter(a => a.date === this.att.date).sort((a, b) => a.in.localeCompare(b.in)); },
    get myAttendance() { return this.me ? this.db.attendance.filter(a => a.staffId === this.me.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14) : []; },
    hoursRange(sid, from, to) { return this.db.attendance.filter(a => a.staffId === sid && a.date >= from && a.date <= to).reduce((t, a) => t + this.liveHrs(a), 0); },
    // Tips & incentives
    get tipRange() { const ws = weekStart(this.now); const s = this.tips.period === 'this' ? ws : addDays(ws, -7); return { from: ymd(s), to: ymd(addDays(s, 6)) }; },
    get tipRows() {
      const { from, to } = this.tipRange;
      const rows = this.db.staff.filter(s => s.active && this.tips.roles.includes(s.role)).map(s => {
        const recs = this.db.attendance.filter(a => a.staffId === s.id && a.date >= from && a.date <= to && a.out);
        return { s, recs, hours: recs.reduce((t, a) => t + this.hrs(a), 0), late: recs.filter(a => this.isLate(a)).length, shifts: recs.length };
      });
      const total = rows.reduce((t, r) => t + r.hours, 0);
      rows.forEach(r => {
        r.tip = total ? (+this.tips.pool || 0) * r.hours / total : 0;
        r.inc = r.hours * (+this.tips.rate || 0);
        r.bonus = r.late === 0 && r.shifts > 0 ? (+this.tips.bonus || 0) : 0;
        r.total = r.tip + r.inc + r.bonus;
      });
      return rows.sort((a, b) => b.total - a.total);
    },
    get tipTotals() { const r = this.tipRows; return { hours: r.reduce((t, x) => t + x.hours, 0), total: r.reduce((t, x) => t + x.total, 0) }; },
    tipSummary() {
      return `Phinik Oasis · Tips & incentives (${this.fmtDate(this.tipRange.from)}–${this.fmtDate(this.tipRange.to)})\n` +
        this.tipRows.map(r => `${r.s.name}: ${r.hours.toFixed(1)}h → ${this.inr(r.total)}`).join('\n') + `\nTotal: ${this.inr(this.tipTotals.total)}`;
    },

    /* ================= 3c. PMS ================= */
    itemInfo(name) { return this.db.items.find(i => i.name === name); },
    latestPrice(name) { return latestPrice(this.db, name); },
    vendorName(id) { const v = this.db.vendors.find(x => x.id === id); return v ? v.name : '—'; },
    get filteredVendors() { return this.db.vendors.filter(v => this.ven.cat === 'All' || v.cat === this.ven.cat); },
    vendorSpend(vid) { const from = ymd(addDays(this.now, -29)); return this.db.purchases.filter(p => p.vendorId === vid && p.date >= from).reduce((t, p) => t + p.price, 0); },
    vendorPOs(vid) { const from = ymd(addDays(this.now, -29)); return this.db.purchases.filter(p => p.vendorId === vid && p.date >= from).length; },
    addVendor() {
      const f = this.ven.form; if (!f.name.trim()) return;
      this.db.vendors.push({ id: uid('v'), name: f.name.trim(), cat: f.cat, contact: f.contact, phone: f.phone, terms: 'Cash on delivery', rating: 3 });
      this.log('added vendor ' + f.name.trim()); this.toast('Vendor saved');
      this.ven.form = { name: '', cat: 'Vegetables', contact: '', phone: '' }; this.ven.showForm = false;
    },
    get poVendor() { return this.db.vendors.find(v => v.id === this.po.form.vendorId); },
    get poItems() { const v = this.poVendor; return this.db.items.filter(i => !v || i.cat === v.cat); },
    get poUnitPrice() { const q = +this.po.form.qty, p = +this.po.form.price; return q > 0 && p > 0 ? p / q : 0; },
    get poDelta() { const u = this.poUnitPrice; if (!u) return null; const last = this.latestPrice(this.po.form.item); return last ? (u - last) / last * 100 : null; },
    addPurchase() {
      const f = this.po.form, it = this.itemInfo(f.item);
      if (!it || !(+f.qty > 0) || !(+f.price > 0)) return this.toast('Enter a valid item, quantity and price', 'error');
      const delta = this.poDelta;
      const id = uid('p');
      this.db.purchases.push({ id, ts: Date.now(), date: f.date || this.today, vendorId: f.vendorId, item: f.item, qty: +f.qty, unit: it.unit, price: +f.price, notes: f.notes, by: this.session.staffId || 'admin' });
      this.po.flash = id; setTimeout(() => { this.po.flash = null; }, 2500);
      this.log(`logged purchase: ${f.qty} ${it.unit} ${f.item} for ${this.inr(+f.price)}`);
      this.toast(`${f.item} logged · ${this.inr(+f.price)}` + (delta !== null && Math.abs(delta) >= 5 ? ` (${delta > 0 ? '▲' : '▼'}${Math.abs(delta).toFixed(1)}%)` : ''), delta > 5 ? 'info' : 'success');
      this.po.form.qty = ''; this.po.form.price = ''; this.po.form.notes = '';
    },
    deletePurchase(id) { this.db.purchases = this.db.purchases.filter(p => p.id !== id); this.log('deleted a purchase entry'); this.toast('Purchase deleted', 'info'); },
    get poRows() {
      const from = this.po.range === '1w' ? ymd(weekStart(this.now)) : this.po.range === '4w' ? ymd(addDays(weekStart(this.now), -21)) : '0000';
      return this.db.purchases
        .filter(p => p.date >= from && (this.po.filterCat === 'All' || (this.itemInfo(p.item) || {}).cat === this.po.filterCat))
        .sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
    },
    get poCatTotals() { const m = {}; this.poRows.forEach(p => { const c = (this.itemInfo(p.item) || {}).cat; m[c] = (m[c] || 0) + p.price; }); return m; },
    // Price tracker
    weekIdx(dateStr) { return Math.round((weekStart(this.now) - weekStart(parseYmd(dateStr))) / (7 * 864e5)); },
    get weekLabels() { const ws = weekStart(this.now); return [3, 2, 1, 0].map(w => w === 0 ? 'This wk' : w === 1 ? 'Last wk' : this.fmtDate(ymd(addDays(ws, -7 * w)))); },
    get priceRows() {
      return this.db.items.map(it => {
        const series = [3, 2, 1, 0].map(w => {
          const ps = this.db.purchases.filter(p => p.item === it.name && this.weekIdx(p.date) === w);
          const q = ps.reduce((t, p) => t + p.qty, 0), v = ps.reduce((t, p) => t + p.price, 0);
          return q ? v / q : null;
        });
        const vals = series.filter(x => x !== null);
        const latest = vals[vals.length - 1], prev = vals[vals.length - 2], first = vals[0];
        return { it, series, latest, wow: (latest && prev) ? (latest - prev) / prev * 100 : null, m4: (vals.length > 1) ? (latest - first) / first * 100 : null, max: Math.max(...vals), min: Math.min(...vals) };
      });
    },
    get inflationAlerts() { return this.priceRows.filter(r => r.wow !== null && r.wow > 5).sort((a, b) => b.wow - a.wow); },
    get basketInflation() {
      let w = 0, s = 0;
      this.priceRows.forEach(r => { if (r.wow === null) return; const spend = this.db.purchases.filter(p => p.item === r.it.name && this.weekIdx(p.date) <= 3).reduce((t, p) => t + p.price, 0); w += spend; s += spend * r.wow; });
      return w ? s / w : 0;
    },
    get weeklySpend() {
      return [3, 2, 1, 0].map((w, i) => {
        const ps = this.db.purchases.filter(p => this.weekIdx(p.date) === w);
        const byCat = {}; ps.forEach(p => { const c = (this.itemInfo(p.item) || {}).cat; byCat[c] = (byCat[c] || 0) + p.price; });
        return { label: this.weekLabels[i], total: ps.reduce((t, p) => t + p.price, 0), byCat };
      });
    },
    get maxWeekSpend() { return Math.max(1, ...this.weeklySpend.map(w => w.total)); },

    /* ================= 3d. KITCHEN ================= */
    lineCost(g) { return (+g.qty || 0) * this.latestPrice(g.item); },
    plateCost(r) { return r.ing.reduce((t, g) => t + this.lineCost(g), 0); },
    foodPct(r) { return r.price ? this.plateCost(r) / r.price * 100 : 0; },
    pctCls(p) { return p < 30 ? 'bg-green-100 text-green-800' : p <= 38 ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'; },
    get selRecipe() { return this.db.recipes.find(r => r.id === this.rec.sel) || this.db.recipes[0]; },
    fmtQty(q, unit) { if ((unit === 'kg' || unit === 'L') && q < 1) return Math.round(q * 1000) + (unit === 'kg' ? ' g' : ' ml'); return (+(+q).toFixed(2)) + ' ' + unit; },
    addIngredient() {
      const q = +this.rec.addQty; if (!(q > 0)) return this.toast('Enter a quantity', 'error');
      const r = this.selRecipe, ex = r.ing.find(g => g.item === this.rec.addItem);
      if (ex) ex.qty = +(ex.qty + q).toFixed(3); else r.ing.push({ item: this.rec.addItem, qty: q });
      this.rec.addQty = ''; this.log(`updated recipe ${r.name}`); this.toast('Ingredient added');
    },
    addRecipe() {
      if (!this.rec.newName.trim() || !(+this.rec.newPrice > 0)) return;
      const id = uid('r');
      this.db.recipes.push({ id, name: this.rec.newName.trim(), category: 'New item', price: +this.rec.newPrice, ing: [] });
      this.rec.sel = id; this.log('created recipe ' + this.rec.newName.trim()); this.rec.newName = ''; this.rec.newPrice = '';
      this.toast('Dish created — add its ingredients');
    },
    deleteRecipe(id) {
      if (this.db.recipes.length <= 1) return;
      const r = this.db.recipes.find(x => x.id === id);
      this.db.recipes = this.db.recipes.filter(x => x.id !== id); this.rec.sel = this.db.recipes[0].id;
      this.log('deleted recipe ' + r.name); this.toast('Dish removed', 'info');
    },
    // Waste
    get wUnit() { return this.wst.form.kind === 'dish' ? 'portions' : ((this.itemInfo(this.wst.form.item) || {}).unit || ''); },
    get wCost() {
      const q = +this.wst.form.qty || 0;
      if (this.wst.form.kind === 'dish') { const r = this.db.recipes.find(x => x.id === this.wst.form.dish); return r ? q * this.plateCost(r) : 0; }
      return q * this.latestPrice(this.wst.form.item);
    },
    addWaste() {
      const f = this.wst.form, q = +f.qty;
      if (!(q > 0)) return this.toast('Enter a quantity', 'error');
      const isDish = f.kind === 'dish';
      const item = isDish ? this.db.recipes.find(x => x.id === f.dish).name : f.item;
      const id = uid('w');
      this.db.waste.push({ id, date: this.today, time: this.nowHM(), kind: f.kind, item, qty: q, unit: isDish ? 'portion' : this.wUnit, reason: f.reason, cost: Math.round(this.wCost * 100) / 100, by: this.session.staffId || 'admin', notes: f.notes });
      this.wst.flash = id; setTimeout(() => { this.wst.flash = null; }, 2500);
      this.log(`logged waste: ${q} ${isDish ? 'portion(s)' : this.wUnit} ${item} (${f.reason})`);
      this.toast(`Waste logged · ${this.inr2(this.db.waste[this.db.waste.length - 1].cost)}`);
      f.qty = ''; f.notes = '';
    },
    deleteWaste(id) { this.db.waste = this.db.waste.filter(w => w.id !== id); this.toast('Entry deleted', 'info'); },
    get wasteRows() {
      let r = this.db.waste.slice();
      if (this.isStaff) r = r.filter(w => w.by === this.session.staffId);
      return r.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
    },
    get waste7List() { const from = ymd(addDays(this.now, -6)); return this.db.waste.filter(w => w.date >= from); },
    get waste7() { return this.waste7List.reduce((t, w) => t + w.cost, 0); },
    get wasteByReason() {
      const m = {};
      this.waste7List.forEach(w => { m[w.reason] = m[w.reason] || { reason: w.reason, cost: 0, n: 0 }; m[w.reason].cost += w.cost; m[w.reason].n++; });
      const arr = Object.values(m).sort((a, b) => b.cost - a.cost);
      const max = Math.max(1, ...arr.map(a => a.cost)); arr.forEach(a => a.pct = a.cost / max * 100);
      return arr;
    },
    get topWasted() {
      const m = {}; this.waste7List.forEach(w => { m[w.item] = (m[w.item] || 0) + w.cost; });
      return Object.entries(m).map(([item, cost]) => ({ item, cost })).sort((a, b) => b.cost - a.cost).slice(0, 6);
    },

    /* ================= 3e. CRM ================= */
    get sortedFeedback() { return this.db.feedback.slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)); },
    get fbList() { return this.sortedFeedback.filter(f => (this.fb.filter === 'all' || f.status === this.fb.filter) && (!this.fb.lowOnly || f.rating <= 3)); },
    get fbSel() { return this.db.feedback.find(f => f.id === this.fb.sel); },
    fbCount(s) { return this.db.feedback.filter(f => f.status === s).length; },
    get openFb() { return this.db.feedback.filter(f => f.status !== 'resolved').length; },
    get fb30() { const from = ymd(addDays(this.now, -29)); return this.db.feedback.filter(f => f.date >= from); },
    get avgRating30() { const l = this.fb30; return l.length ? l.reduce((t, f) => t + f.rating, 0) / l.length : 0; },
    statusLabel(s) { return { new: 'New', 'in-progress': 'In progress', resolved: 'Resolved' }[s]; },
    statusCls(s) { return { new: 'bg-red-100 text-red-700', 'in-progress': 'bg-yellow-100 text-yellow-800', resolved: 'bg-green-100 text-green-800' }[s]; },
    get quickReplies() {
      const f = this.fbSel; if (!f) return [];
      const n = f.name || 'dear guest';
      return f.rating <= 3
        ? [`Dear ${n}, we're truly sorry about your experience. I've personally looked into it and briefed the team — your next meal is on us. — Pawan, Phinik Oasis`,
           `Thank you for flagging this, ${n}. We've fixed the issue and would love the chance to serve you better on your next visit.`]
        : [`Thank you so much, ${n}! Your words mean a lot to our team. If you have a moment, we'd be grateful if you shared this on Google 🙏`,
           `So happy you enjoyed your visit, ${n}! We've passed your kind words on to the team.`];
    },
    setStatus(f, s) { f.status = s; this.log(`marked feedback from ${f.name || 'Anonymous'} as ${this.statusLabel(s)}`); this.toast('Feedback marked ' + this.statusLabel(s)); },
    sendReply() {
      const f = this.fbSel, txt = this.fb.reply.trim(); if (!f || !txt) return;
      f.replies.push({ by: this.userName, text: txt, at: this.today + ' ' + this.nowHM() });
      if (f.status === 'new') f.status = 'in-progress';
      this.fb.reply = '';
      this.log('replied to ' + (f.name || 'anonymous guest'));
      this.toast(f.phone && f.optIn ? 'Reply sent to guest on WhatsApp (simulated)' : 'Saved as internal note — guest left no contact', f.phone ? 'success' : 'info');
    },
    togglePublic(f) { f.publicOk = !f.publicOk; this.log((f.publicOk ? 'sent Google review invite to ' : 'withdrew review invite for ') + (f.name || 'guest')); this.toast(f.publicOk ? 'Google review invite sent (simulated)' : 'Invite withdrawn', 'info'); },
    // QR guest flow
    openTable(t) { this.qr.table = t; this.qr.step = 'form'; this.qr.form = { rating: 0, category: '', message: '', name: '', phone: '', optIn: true }; },
    submitFeedback() {
      const f = this.qr.form;
      if (!f.rating) return this.toast('Please tap a star rating', 'error');
      const entry = { id: uid('f'), date: this.today, time: this.nowHM(), table: this.qr.table, rating: f.rating, category: f.category || 'Other', message: f.message.trim() || '(No comment — rating only)', name: f.name.trim(), phone: f.phone.replace(/\D/g, ''), optIn: !!(f.optIn && f.phone), status: 'new', replies: [], publicOk: false };
      this.db.feedback.push(entry);
      if (entry.phone) {
        const c = this.db.contacts.find(x => x.phone === entry.phone);
        if (c) { c.visits++; c.lastVisit = this.today; c.optIn = c.optIn || entry.optIn; }
        else this.db.contacts.push({ name: entry.name || 'Guest', phone: entry.phone, lastVisit: this.today, visits: 1, optIn: entry.optIn });
      }
      this.qr.last = entry; this.qr.step = 'done'; this.fb.sel = entry.id;
      this.db.activity.unshift({ at: this.today + ' ' + this.nowHM(), who: 'Guest @' + entry.table, text: `left ${entry.rating}★ private feedback` });
      this.toast(entry.rating <= 3 ? `⚠ New ${entry.rating}★ complaint from ${entry.table} — inbox alerted` : `New ${entry.rating}★ feedback from ${entry.table}`, entry.rating <= 3 ? 'error' : 'success');
    },
    qrSvg(label) {
      if (this._qrCache[label]) return this._qrCache[label];
      const n = 21, s = 6; let sd = 7; for (const c of label) sd = sd * 31 + c.charCodeAt(0);
      const r = rng(sd);
      const inF = (i, j) => (i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9);
      let out = `<svg viewBox="0 0 ${n * s} ${n * s}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#fff"/>`;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (!inF(i, j) && r() < 0.5) out += `<rect x="${i * s}" y="${j * s}" width="${s}" height="${s}" fill="#0b3b38"/>`;
      const finder = (x, y) => `<rect x="${x * s}" y="${y * s}" width="${7 * s}" height="${7 * s}" fill="#0b3b38"/><rect x="${(x + 1) * s}" y="${(y + 1) * s}" width="${5 * s}" height="${5 * s}" fill="#fff"/><rect x="${(x + 2) * s}" y="${(y + 2) * s}" width="${3 * s}" height="${3 * s}" fill="#0b3b38"/>`;
      out += finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7) + '</svg>';
      return (this._qrCache[label] = out);
    },
    // WhatsApp
    daysSince(d) { return Math.round((parseYmd(this.today) - parseYmd(d)) / 864e5); },
    get waAudience() {
      let list = this.db.contacts.filter(c => c.optIn);
      const s = this.wa.segment;
      if (s === 'regular') list = list.filter(c => c.visits >= 5);
      if (s === 'lapsed') list = list.filter(c => this.daysSince(c.lastVisit) > 30);
      if (s === 'new') list = list.filter(c => c.visits <= 1);
      if (s === 'complaint') { const ph = this.db.feedback.filter(f => f.rating <= 3 && f.phone).map(f => f.phone); list = list.filter(c => ph.includes(c.phone)); }
      return list;
    },
    get waPreviewName() { return this.waAudience[0] ? this.waAudience[0].name.split(' ')[0] : 'Guest'; },
    /** Builds the broadcast copy. {name} is replaced per-recipient at send time. */
    waMessage(name) {
      const w = this.wa, H = w.tone === 'hinglish', E = x => w.emoji ? x + ' ' : '';
      const nm = name || '{name}';
      const till = w.validTill ? parseYmd(w.validTill).toLocaleDateString('en-IN', { day: 'numeric', month: 'long' }) : '';
      const off = +w.discount > 0 ? `${w.discount}% OFF` : '';
      const tillTxt = till ? (H ? ` Offer ${till} tak valid hai.` : ` Valid till ${till}.`) : '';
      const book = H ? `${E('📞')}Table book karne ke liye reply karein ya call karein: ${w.cta}` : `${E('📞')}Reply here or call ${w.cta} to reserve your table.`;
      let m = '';
      switch (w.type) {
        case 'festive': m = H
          ? `${E('🪔')}Namaste ${nm} ji!\n\nIs tyohaar ko khaas banaiye Phinik Oasis ke saath. Pesh hai *${w.headline}*${off ? ` — poore bill par *${off}*` : ''}!${tillTxt}\n\n${book}`
          : `${E('🪔')}Dear ${nm},\n\nMake this festive season special at Phinik Oasis. Introducing *${w.headline}*${off ? ` — enjoy *${off}* on your total bill` : ''}!${tillTxt}\n\n${book}`; break;
        case 'weekend': m = H
          ? `${E('🍛')}Hi ${nm}!\n\nIs weekend kuch bada plan kijiye — *${w.headline}* Phinik Oasis mein${off ? `, sirf aapke liye *${off}*` : ''}. Live tandoor, desserts aur bahut kuch!${tillTxt}\n\n${book}`
          : `${E('🍛')}Hi ${nm}!\n\nYour weekend plan is sorted: *${w.headline}* at Phinik Oasis${off ? ` with an exclusive *${off}* for you` : ''}. Live tandoor, desserts and more!${tillTxt}\n\n${book}`; break;
        case 'newmenu': m = H
          ? `${E('✨')}${nm} ji, kuch naya aaya hai!\n\nChef Ravi ne launch kiye hain *${w.headline}*. Sabse pehle taste kijiye${off ? ` aur paaiye *${off}*` : ''}.${tillTxt}\n\n${book}`
          : `${E('✨')}${nm}, something new is cooking!\n\nChef Ravi has just launched *${w.headline}*. Be among the first to try them${off ? ` and get *${off}*` : ''}.${tillTxt}\n\n${book}`; break;
        case 'winback': m = H
          ? `${E('💛')}${nm} ji, bahut din ho gaye!\n\nPhinik Oasis mein aapki kami mehsoos ho rahi hai. Wapas aaiye aur paaiye *${off || 'ek complimentary dessert'}*.${tillTxt}\n\n${book}`
          : `${E('💛')}${nm}, it's been a while!\n\nWe've missed you at Phinik Oasis. Come back and enjoy *${off || 'a complimentary dessert'}* on us.${tillTxt}\n\n${book}`; break;
        case 'recovery': m = H
          ? `${E('🙏')}${nm} ji, pichhli visit ke liye hum dil se maafi chahte hain.\n\nAapka feedback humne seriously liya hai aur sudhaar kiya hai. Humein ek aur mauka dijiye — agli visit par *${off || 'ek complimentary main course'}*.${tillTxt}\n\n${book}`
          : `${E('🙏')}Dear ${nm},\n\nWe're truly sorry your last visit fell short. We've acted on your feedback and would love another chance — enjoy *${off || 'a complimentary main course'}* on your next visit.${tillTxt}\n\n${book}`; break;
        case 'birthday': m = H
          ? `${E('🎂')}Happy Birthday month, ${nm} ji!\n\nCelebrate kijiye Phinik Oasis mein — *${w.headline}*: ${off ? `*${off}*` : 'complimentary cake'} aapki party ke liye.${tillTxt}\n\n${book}`
          : `${E('🎂')}Happy birthday month, ${nm}!\n\nCelebrate with us at Phinik Oasis — *${w.headline}*: ${off ? `*${off}*` : 'a complimentary cake'} for your celebration.${tillTxt}\n\n${book}`; break;
      }
      const sign = H ? `\n\n— Pawan & Team, Phinik Oasis` : `\n\nWarm regards,\nPawan & Team, Phinik Oasis`;
      return m + sign + (H ? `\n\n_Messages band karne ke liye STOP reply karein._` : `\n\n_Reply STOP to opt out._`);
    },
    waHtml(t) {
      return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*(.+?)\*/g, '<b>$1</b>').replace(/_(.+?)_/g, '<i class="text-gray-500">$1</i>');
    },
    scheduleCampaign() {
      this.db.campaigns.unshift({ id: uid('c'), at: this.today + ' ' + this.nowHM(), headline: this.wa.headline, type: this.wa.type, count: this.waAudience.length, status: 'Queued (simulated)', by: this.userName });
      this.log(`queued WhatsApp campaign "${this.wa.headline}" to ${this.waAudience.length} guests`);
      this.toast(`Campaign queued for ${this.waAudience.length} opted-in guests`);
    },

    /* ================= 3f. DASHBOARD & HELPERS ================= */
    get today() { return ymd(this.now); },
    get dateLabel() { return this.now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); },
    get greet() { const h = this.now.getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; },
    get spend7() { const from = ymd(addDays(this.now, -6)); return this.db.purchases.filter(p => p.date >= from && p.date <= this.today).reduce((t, p) => t + p.price, 0); },
    get monthSpend() { const m = this.today.slice(0, 7); return this.db.purchases.filter(p => p.date.startsWith(m)).reduce((t, p) => t + p.price, 0); },
    get att7() { const from = ymd(addDays(this.now, -6)); return this.db.attendance.filter(a => a.date >= from && a.date <= this.today); },
    get hours7() { return this.att7.reduce((t, a) => t + this.liveHrs(a), 0); },
    get labour7() { return this.att7.reduce((t, a) => { const s = this.db.staff.find(x => x.id === a.staffId); return t + (s ? this.liveHrs(a) * this.hourly(s) : 0); }, 0); },
    get kpis() {
      if (this.isAdmin) return [
        { label: 'Purchases · 7 days', value: this.inr(this.spend7), sub: 'Month-to-date ' + this.inr(this.monthSpend) },
        { label: 'Labour cost · 7 days', value: this.inr(this.labour7), sub: this.hours7.toFixed(0) + ' staff-hours logged' },
        { label: 'Waste · 7 days', value: this.inr(this.waste7), sub: (this.spend7 ? (this.waste7 / this.spend7 * 100).toFixed(1) : 0) + '% of purchases', cls: 'text-red-600' },
        { label: 'Guest rating · 30d', value: this.avgRating30.toFixed(1) + ' ★', sub: this.fb30.length + ' private reviews', cls: 'text-yellow-600' },
        { label: 'Open feedback', value: this.openFb, sub: this.fbCount('new') + ' new & unanswered', cls: this.openFb ? 'text-red-600' : '' },
      ];
      return [
        { label: 'Rostered today', value: this.scheduledToday.length, sub: 'staff on the rota' },
        { label: 'On duty now', value: this.onDutyNow, sub: 'checked in', cls: 'text-green-600' },
        { label: 'Waste entries · 7d', value: this.waste7List.length, sub: 'logged by the team' },
        { label: 'Price alerts', value: this.inflationAlerts.length, sub: 'items up >5% WoW', cls: this.inflationAlerts.length ? 'text-red-600' : '' },
        { label: 'Open feedback', value: this.openFb, sub: this.fbCount('new') + ' new', cls: this.openFb ? 'text-red-600' : '' },
      ];
    },
    staffName(id) { if (id === 'admin') return 'Pawan'; const s = this.db.staff.find(x => x.id === id); return s ? s.name : '—'; },
    roleCls(r) { return { Manager: 'bg-purple-100 text-purple-800', Waiter: 'bg-blue-100 text-blue-800', Chef: 'bg-red-100 text-red-800', Cleaner: 'bg-green-100 text-green-800' }[r] || 'bg-gray-100'; },
    initials(n) { return (n || '?').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase(); },
    stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); },
    ymd, weekStart,
    dow(s) { return parseYmd(s).toLocaleDateString('en-IN', { weekday: 'short' }); },
    dnum(s) { return parseYmd(s).getDate(); },
    fmtDate(s) { return parseYmd(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); },
    fmtDateY(s) { return parseYmd(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); },
    inr(n) { return '₹' + Math.round(n || 0).toLocaleString('en-IN'); },
    inr2(n) { return '₹' + (n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
    inrK(n) { return n >= 100000 ? '₹' + (n / 100000).toFixed(2) + 'L' : n >= 1000 ? '₹' + (n / 1000).toFixed(1) + 'k' : this.inr(n); },
    log(text) { this.db.activity.unshift({ at: this.today + ' ' + this.nowHM(), who: this.userName, text }); if (this.db.activity.length > 60) this.db.activity.length = 60; },

      try { await navigator.clipboard.writeText(t); this.toast('Copied to clipboard'); }
      catch (e) {
        const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); this.toast('Copied to clipboard'); } catch (_) { this.toast('Copy blocked — select the text manually', 'error'); }
